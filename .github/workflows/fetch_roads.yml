name: fetch-roads

on:
  schedule:
    - cron: '40 23 * * *'   # UTC 23:40 = 北京时间每天 07:40（与新闻错开）
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch Shuitou roads (real OSM geometry)
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}   # 可选：填入高德 Web 服务 Key 后自动叠加真实车速
        run: python fetch_roads.py

      - name: Commit & push
        run: |
          git config user.name "roads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/roads.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update roads $(date -u +%F)"
            git push
          fi
